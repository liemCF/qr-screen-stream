<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share Session</title>
    <style>
        :root {
            --bg: #0a0d14;
            --card: #111827;
            --card-border: #1f293d;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            text-align: center;
            position: relative;
        }

        .header-icon {
            width: 56px;
            height: 56px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            color: var(--primary);
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .session-tag {
            display: inline-block;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 10px;
            border-radius: 6px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .status-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            padding: 10px 16px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.25);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }

        .status-dot.active {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .status-dot.danger {
            background: var(--danger);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--danger);
            color: #ffffff;
            margin-top: 12px;
            display: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 24px;
            text-align: left;
            font-size: 0.8rem;
        }

        .settings-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-item label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            background: #1a2234;
            color: #ffffff;
            border: 1px solid var(--card-border);
            padding: 6px 8px;
            border-radius: 6px;
            outline: none;
            font-size: 0.8rem;
        }

        .metrics {
            margin-top: 20px;
            display: none;
            padding: 12px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--accent);
        }

        /* Remote cursor marker overlay for input visual feedback */
        #remote-cursor {
            position: fixed;
            width: 18px;
            height: 18px;
            border: 2px solid #ef4444;
            background: rgba(239, 68, 68, 0.35);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            display: none;
            z-index: 99999;
            transition: left 0.05s linear, top 0.05s linear;
        }

        video, canvas {
            display: none;
        }
    </style>
</head>
<body>
    <div id="remote-cursor"></div>

    <div class="container">
        <div class="header-icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
        </div>

        <h1>Screen Share Controller</h1>
        <div class="session-tag" id="session-tag">Token: ...</div>

        <div class="status-box">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Connecting to session server...</span>
        </div>

        <button id="btn-start" class="btn btn-primary" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            Start Screen Share
        </button>

        <button id="btn-stop" class="btn btn-danger">
            Stop Streaming
        </button>

        <div class="settings-grid">
            <div class="settings-item">
                <label for="select-res">Target Res</label>
                <select id="select-res">
                    <option value="1280x720" selected>720p (Fast)</option>
                    <option value="1920x1080">1080p (FHD)</option>
                    <option value="960x540">540p (Low Latency)</option>
                </select>
            </div>
            <div class="settings-item">
                <label for="select-fps">Framerate</label>
                <select id="select-fps">
                    <option value="15" selected>15 FPS</option>
                    <option value="24">24 FPS</option>
                    <option value="10">10 FPS</option>
                </select>
            </div>
        </div>

        <div class="metrics" id="metrics-box">
            Streaming Active · <span id="metric-fps">0</span> FPS · <span id="metric-kb">0</span> KB/s
        </div>
    </div>

    <!-- Hidden video & canvas for frame grabbing -->
    <video id="video-stream" autoplay playsinline muted></video>
    <canvas id="canvas-buffer"></canvas>

    <script>
        const parts = window.location.pathname.split('/');
        const token = parts[parts.length - 1] || new URLSearchParams(window.location.search).get('token') || 'demo';
        document.getElementById('session-tag').textContent = `Token: ${token}`;

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const metricsBox = document.getElementById('metrics-box');
        const metricFps = document.getElementById('metric-fps');
        const metricKb = document.getElementById('metric-kb');
        const selectRes = document.getElementById('select-res');
        const selectFps = document.getElementById('select-fps');
        const remoteCursor = document.getElementById('remote-cursor');

        const video = document.getElementById('video-stream');
        const canvas = document.getElementById('canvas-buffer');
        const ctx = canvas.getContext('2d', { alpha: false });

        let mediaStream = null;
        let isStreaming = false;
        let ws = null;
        let frameCount = 0;
        let byteCount = 0;
        let lastStatsTime = performance.now();
        let targetIntervalMs = 1000 / parseInt(selectFps.value);
        let lastFrameTime = 0;
        let pumpTimer = null;

        selectFps.addEventListener('change', () => {
            targetIntervalMs = 1000 / parseInt(selectFps.value);
        });

        // Initialize WebSocket connection
        function connectWs() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${proto}//${window.location.host}/ws`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                statusDot.classList.add('active');
                statusDot.classList.remove('danger');
                statusText.textContent = 'Server connected · Ready to stream';
                btnStart.disabled = false;

                // Register as target
                ws.send(JSON.stringify({
                    type: 'join',
                    role: 'target',
                    token: token,
                    info: {
                        userAgent: navigator.userAgent,
                        screen: `${window.screen.width}x${window.screen.height}`
                    }
                }));
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleIncomingMessage(data);
                } catch (e) {}
            };

            ws.onclose = () => {
                statusDot.classList.remove('active');
                statusDot.classList.add('danger');
                statusText.textContent = 'Disconnected · Retrying in 3s...';
                btnStart.disabled = true;
                setTimeout(connectWs, 3000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        // Handle incoming control packets from operator
        function handleIncomingMessage(data) {
            if (data.type === 'input') {
                // Show remote cursor position
                if (data.x !== undefined && data.y !== undefined) {
                    const screenX = data.x * window.innerWidth;
                    const screenY = data.y * window.innerHeight;
                    remoteCursor.style.display = 'block';
                    remoteCursor.style.left = `${screenX}px`;
                    remoteCursor.style.top = `${screenY}px`;

                    if (data.event === 'click' || data.event === 'mousedown') {
                        remoteCursor.style.transform = 'translate(-50%, -50%) scale(1.6)';
                        setTimeout(() => {
                            remoteCursor.style.transform = 'translate(-50%, -50%) scale(1.0)';
                        }, 120);
                    }
                }
            }
        }

        async function startCapture() {
            const [w, h] = selectRes.value.split('x').map(Number);
            canvas.width = w;
            canvas.height = h;

            try {
                mediaStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        displaySurface: 'monitor',
                        cursor: 'always',
                        width: { ideal: w },
                        height: { ideal: h }
                    },
                    audio: false
                });

                video.srcObject = mediaStream;
                await video.play();

                isStreaming = true;
                btnStart.style.display = 'none';
                btnStop.style.display = 'inline-flex';
                metricsBox.style.display = 'block';
                statusText.textContent = 'Streaming live to viewer';

                // Handle target ending screen share via browser stop button
                mediaStream.getVideoTracks()[0].onended = () => {
                    stopCapture();
                };

                pumpLoop();
            } catch (err) {
                console.error('getDisplayMedia failed:', err);
                statusText.textContent = `Permission denied or error: ${err.message}`;
            }
        }

        function pumpLoop(now = performance.now()) {
            if (!isStreaming) return;

            pumpTimer = requestAnimationFrame(pumpLoop);

            const delta = now - lastFrameTime;
            if (delta < targetIntervalMs) return;

            // Flow control: skip frame if WebSocket buffer is backing up
            if (ws && ws.bufferedAmount > 64 * 1024) return;

            lastFrameTime = now;

            // Render current video frame to canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Compress as JPEG (quality 0.65 balances latency & sharpness)
            const frameData = canvas.toDataURL('image/jpeg', 0.65);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'frame',
                    token: token,
                    payload: frameData,
                    width: canvas.width,
                    height: canvas.height,
                    timestamp: Date.now()
                }));

                frameCount++;
                byteCount += frameData.length;
            }

            // Stats calculation every second
            if (now - lastStatsTime >= 1000) {
                const elapsedSec = (now - lastStatsTime) / 1000;
                const fps = Math.round(frameCount / elapsedSec);
                const kbps = Math.round((byteCount / 1024) / elapsedSec);

                metricFps.textContent = fps;
                metricKb.textContent = kbps;

                frameCount = 0;
                byteCount = 0;
                lastStatsTime = now;
            }
        }

        function stopCapture() {
            isStreaming = false;
            if (pumpTimer) cancelAnimationFrame(pumpTimer);

            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            video.srcObject = null;

            btnStart.style.display = 'inline-flex';
            btnStop.style.display = 'none';
            metricsBox.style.display = 'none';
            statusText.textContent = 'Stream stopped · Ready to share';
        }

        btnStart.addEventListener('click', startCapture);
        btnStop.addEventListener('click', stopCapture);

        // Start WS handshake
        connectWs();
    </script>
</body>
</html>
